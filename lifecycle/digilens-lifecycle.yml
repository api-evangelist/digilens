summary: >-
  DigiLens versions its developer platform through DigiOS software builds shipped
  over the air to ARGO devices, not through an HTTP API version. Sample projects
  state a minimum DigiOS build and a matching Unity / Snapdragon Spaces SDK
  version. No public status page, SLA, deprecation policy or dated changelog was
  found; release notes sit behind the Cloudflare-protected developer portal.
versioning:
  scheme: device-os-build
  identifier_format: B<major>.<minor>.<build>
  examples:
    - build: B1.0001.2098
      referenced_by: https://github.com/digilens-ar/Gaze-Interaction-Sample
      note: Minimum DigiOS build for the Snapdragon Spaces 1.0.1 gaze sample.
    - build: B1.0001.2116
      referenced_by: https://github.com/digilens-ar/Instructions-App
      note: DigiOS build paired with Snapdragon Spaces Unity SDK 1.0.0.
    - build: B1.0001.2145
      referenced_by: https://github.com/digilens-ar/AndroidStatusDisplay
      note: DigiOS build required by the Android status-display sample.
  api_versioning: none
  note: >-
    There is no versioned HTTP API surface. Compatibility is expressed as
    (DigiOS build) x (Snapdragon Spaces SDK version) x (Unity editor version) in
    each sample repository's prerequisites.
distribution:
  channel: over-the-air
  description: >-
    DigiOS updates are delivered as OTA builds to ARGO devices; the developer
    portal is described by DigiLens as the access point for DigiOS SDKs, OTAs
    and APIs.
  source: https://www.digilens.com/pr-msftintune/
