generated: '2026-08-01'
method: searched
source: https://developer.digilens.com/
name: DigiLens packages and SDKs
summary: >-
  DigiLens ships a first-party device SDK (the DigiOS SDK) for its ARGO AR
  smartglasses, distributed through the DigiLens developer portal rather than a
  public package registry. No DigiLens package was found on npm, PyPI, Maven
  Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io. Application
  development for ARGO targets Unity (C#) or Android Studio (Java/Kotlin) on top
  of the DigiOS SDK plus Qualcomm's Snapdragon Spaces OpenXR SDK, with
  first-party sample projects published in the digilens-ar GitHub organization.

