    required_for: Unity XR development on ARGO
    url: https://spaces.qualcomm.com/
    note: >-
      Third-party (Qualcomm) OpenXR runtime SDK that ARGO Unity development
      depends on. Access is requested from the Snapdragon Spaces support team,
      not from DigiLens.
    versions_referenced:
