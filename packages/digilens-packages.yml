packages:
  - name: DigiOS SDK
    language: java
    platform: android
    official: true
    registry: none
    distribution: developer-portal
    gated: true
    url: https://developer.digilens.com/
    description: >-
      First-party device SDK for DigiOS, the Android-based operating system on
      DigiLens ARGO smartglasses. Exposes device capabilities such as projector
      (display) mode control, IMU/sensor access, voice UI service integration and
      native stereoscopic 3D rendering. Distributed to partners and customers via
      the DigiLens developer portal alongside DigiOS OTA builds; not published to
      a public package registry.
    x-evidence:
      - url: https://github.com/digilens-ar/AndroidStatusDisplay
        quote: >-
          "It uses the DigiOS SDK to switch projector modes safely and reliably."
      - url: https://www.digilens.com/pr-msftintune/
        note: >-
          DigiLens states the developer portal provides access to DigiOS SDKs,
          OTAs and APIs for partners and customers building spatial solutions for
          ARGO.

dependencies:
