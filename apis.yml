aid: digilens
name: DigiLens
description: 'DigiLens Inc. is a Sunnyvale, California company that designs and manufactures
  holographic waveguide optics and augmented reality display systems for extended reality
  (XR). Its Crystal Waveguides are produced with a proprietary photopolymer material
  set, inkjet printing and a holographic contact-copy process rather than etching, and
  are supplied to partners including Samsung, Corning, Panasonic, Sony, Continental,
  Mitsubishi Chemical and Goertek for smartglasses, automotive head-up displays, smart
  helmets and avionics head-up guidance. DigiLens also ships ARGO, a standalone, rugged
  enterprise AR headset running DigiOS — an Android-based operating system with voice
  UI, gaze and scroll-wheel interaction, projector control and Microsoft Intune MDM
  certification. Developers build for ARGO in Unity or Android Studio on top of the
  DigiOS SDK and Qualcomm Snapdragon Spaces, with samples published in the digilens-ar
  GitHub organization and documentation on the DigiLens developer portal. DigiLens has
  raised a Series D led by Samsung Electronics at a valuation above $500M.'
